name: Mend CLI UA

on: workflow_dispatch

jobs:
  cli-ua:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev
          sudo apt update
          sudo apt install gdal-bin libgdal-dev
          sudo apt install libfontconfig1-dev libfreetype6-dev pkg-config
          sudo apt install libharfbuzz-dev libfribidi-dev
          
      - name: Install packages
        run: |
          Rscript -e 'install.packages("officer", repos="https://ftp.belnet.be/mirror/CRAN/")'
          Rscript -e 'install.packages("tidyverse", repos="https://ftp.belnet.be/mirror/CRAN/")'
          Rscript -e 'install.packages("read_xlsx", repos="https://ftp.belnet.be/mirror/CRAN/")'
          Rscript -e 'install.packages("writexl", repos="https://ftp.belnet.be/mirror/CRAN/")'
          Rscript -e 'install.packages("splitstackshape", repos="https://ftp.belnet.be/mirror/CRAN/")'
          Rscript -e 'install.packages("tools", repos="https://ftp.belnet.be/mirror/CRAN/")'

      - name: Lists what is currently installed in your R library
        run: Rscript -e 'installed.packages()'
        
#      - name: Install Packrat
#        run: Rscript -e 'install.packages("packrat", repos="https://cloud.r-project.org")'
        
#      - name: Restore dependencies
#        run: |
#          # Create the packrat/packrat.lock file that is missing from the project.
#          Rscript -e 'packrat::init()'
#          Rscript -e 'packrat::snapshot()'
#          Rscript -e 'packrat::restore()'
          
      - name: Create only if the DESCRIPTION file doesn’t already exist in repo root
        run: |
          if [ ! -f ./DESCRIPTION ]; then
            touch ./DESCRIPTION
          fi
          
      - name: Mend CLI Scan
        env:
          MEND_EMAIL: ${{secrets.MEND_EMAIL}}
          MEND_USER_KEY: ${{secrets.MEND_USER_KEY}}
          MEND_URL: https://saas.mend.io
          MEND_LOG_LEVEL: DEBUG
          WS_R_CRANMIRRORURL: https://cran.rstudio.com
          WS_R_RUNPRESTEP: true
#          WS_R_PACKAGEMANAGER: 'none'
        run: |
          echo Downloading Mend CLI
          curl https://downloads.mend.io/cli/linux_amd64/mend -o /usr/local/bin/mend && chmod +x /usr/local/bin/mend
          echo run Mend scan
          mend dep -u -s "*//Packrat//recyclability-score-simulation-tool"
#          mend ua -project recyclability-score-simulation-tool -product Packrat -wss.url https://saas.mend.io/agent

      - name: 'Upload .mend/logs folder'
        uses: actions/upload-artifact@v4
        with:
          name: Mend logs
          path: /home/runner/.mend/logs/
          retention-days: 1
        
